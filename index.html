<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Destore</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root, [data-theme="ember"] {
      --bg: #0c0a09;
      --ink: #f6efe4;
      --muted: #a89886;
      --line: rgba(230, 177, 90, 0.2);
      --gold: #e6b15a;
      --ember: #ff6a45;
      --card: rgba(28, 22, 16, 0.55);
      --card-solid: #1c1610;
      --ok: #3dd6c6;
      --danger: #ff7b8a;
      --radius: 18px;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      --select-bg: #1c1610;
      --select-text: #f6efe4;
    }

    [data-theme="noir"] {
      --bg: #08090c;
      --ink: #eef2f7;
      --muted: #8b93a7;
      --line: rgba(140, 160, 220, 0.18);
      --gold: #9db4ff;
      --ember: #7c5cff;
      --card: rgba(18, 22, 34, 0.55);
      --card-solid: #12162a;
      --select-bg: #12162a;
      --select-text: #eef2f7;
    }

    [data-theme="olive"] {
      --bg: #0b0d0a;
      --ink: #f3f0e6;
      --muted: #9aa38c;
      --line: rgba(180, 190, 120, 0.2);
      --gold: #c6d36b;
      --ember: #e0a35b;
      --card: rgba(20, 24, 16, 0.55);
      --card-solid: #151910;
      --select-bg: #151910;
      --select-text: #f3f0e6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    body { overflow-x: hidden; }

    .fx {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background: var(--bg);
    }

    .fx-wave {
      position: absolute;
      inset: -30%;
      background:
        conic-gradient(from 120deg at 30% 20%, rgba(230,177,90,0.16), transparent 28%, rgba(255,106,69,0.12) 48%, transparent 62%, rgba(61,214,198,0.08) 78%, transparent 90%),
        radial-gradient(ellipse at 70% 80%, rgba(230,177,90,0.14), transparent 42%);
      animation: wave 22s ease-in-out infinite alternate;
      filter: blur(8px) saturate(1.15);
    }

    [data-theme="noir"] .fx-wave {
      background:
        conic-gradient(from 80deg at 40% 30%, rgba(157,180,255,0.16), transparent 30%, rgba(124,92,255,0.14) 50%, transparent 68%, rgba(100,200,255,0.08) 82%, transparent 95%),
        radial-gradient(ellipse at 20% 70%, rgba(124,92,255,0.14), transparent 45%);
    }

    [data-theme="olive"] .fx-wave {
      background:
        conic-gradient(from 200deg at 55% 25%, rgba(198,211,107,0.15), transparent 32%, rgba(224,163,91,0.12) 52%, transparent 70%, rgba(120,160,100,0.1) 85%, transparent 96%),
        radial-gradient(ellipse at 80% 60%, rgba(198,211,107,0.12), transparent 44%);
    }

    .fx-beam {
      position: absolute;
      width: 140%;
      height: 40%;
      left: -20%;
      top: 30%;
      background: linear-gradient(90deg, transparent, rgba(230,177,90,0.08), transparent);
      transform: rotate(-12deg);
      animation: beam 14s linear infinite;
      filter: blur(20px);
    }

    [data-theme="noir"] .fx-beam {
      background: linear-gradient(90deg, transparent, rgba(157,180,255,0.1), transparent);
    }

    [data-theme="olive"] .fx-beam {
      background: linear-gradient(90deg, transparent, rgba(198,211,107,0.1), transparent);
    }

    .fx-noise {
      position: absolute;
      inset: 0;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    @keyframes wave {
      0% { transform: translate3d(0,0,0) rotate(0deg) scale(1); }
      100% { transform: translate3d(-4%, 3%, 0) rotate(8deg) scale(1.12); }
    }
    @keyframes beam {
      0% { transform: translateX(-30%) rotate(-12deg); }
      100% { transform: translateX(30%) rotate(-12deg); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .app {
      width: min(100%, 440px);
      margin: 0 auto;
      padding: 18px 16px 48px;
      animation: rise 0.4s ease both;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand-kicker {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .brand-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 42px;
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #fff6e8 10%, var(--gold) 48%, var(--ember) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand-sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    button, .icon-btn, .ghost, .primary, .danger, .soft {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .icon-btn, .ghost, .soft {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(12px);
    }

    .primary {
      width: 100%;
      border-radius: 999px;
      padding: 15px 18px;
      font-weight: 700;
      color: #1a1208;
      background: linear-gradient(120deg, var(--gold), color-mix(in oklab, var(--gold) 60%, white) 42%, var(--ember));
      box-shadow: 0 12px 30px color-mix(in oklab, var(--ember) 25%, transparent);
    }

    .primary.ask {
      color: var(--ink);
      background: linear-gradient(120deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .primary.disabled {
      opacity: 0.55;
      pointer-events: none;
      filter: grayscale(0.2);
    }

    .danger, .soft {
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .danger {
      background: rgba(255, 123, 138, 0.12);
      color: var(--danger);
      border: 1px solid rgba(255, 123, 138, 0.25);
    }

    .section-label {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .list { display: grid; gap: 10px; }

    .card {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      color: inherit;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .card:active { transform: scale(0.985); }

    .thumb, .thumb-ph {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      flex: none;
      object-fit: cover;
    }
    .thumb {
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 18px rgba(0,0,0,0.28);
    }
    .thumb.lg { width: 84px; height: 84px; border-radius: 22px; }
    .thumb-ph {
      display: grid;
      place-items: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 22px;
      color: var(--gold);
      background: linear-gradient(145deg, color-mix(in oklab, var(--gold) 24%, transparent), color-mix(in oklab, var(--ember) 10%, var(--card-solid)));
      border: 1px solid color-mix(in oklab, var(--gold) 30%, transparent);
    }
    .thumb-ph.lg { width: 84px; height: 84px; border-radius: 22px; font-size: 34px; }

    .card-title { font-size: 16px; font-weight: 600; line-height: 1.25; }
    .card-meta { margin-top: 4px; font-size: 13px; color: var(--muted); }
    .price { color: var(--gold); font-weight: 600; }
    .badge {
      display: inline-flex;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--danger);
      border: 1px solid rgba(255,123,138,0.35);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .badge.ask {
      color: var(--gold);
      border-color: color-mix(in oklab, var(--gold) 40%, transparent);
    }

    .panel {
      border: 1px solid var(--line);
      background: color-mix(in oklab, var(--card-solid) 70%, transparent);
      border-radius: 24px;
      padding: 16px;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .field, .area, .select {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--select-bg);
      color: var(--select-text);
      padding: 12px 14px;
      font: inherit;
      outline: none;
    }

    .select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 12px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 36px;
    }

    .select option {
      background: var(--select-bg);
      color: var(--select-text);
    }

    .area { resize: vertical; min-height: 88px; }
    .field:focus, .area:focus, .select:focus {
      border-color: color-mix(in oklab, var(--gold) 55%, transparent);
    }

    .form-grid { display: grid; gap: 10px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .msg { color: var(--gold); font-size: 13px; }
    .stack { display: grid; gap: 14px; }
    .spacer { height: 8px; }
    .back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; }
    .detail-head { margin-bottom: 14px; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 36px 12px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: color-mix(in oklab, var(--card) 70%, transparent);
    }
    .admin-block { display: grid; gap: 16px; }
    .admin-block h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 24px;
      font-weight: 600;
    }
    .file-line { display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
    .mini-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .edit-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    @media (prefers-reduced-motion: reduce) {
      .fx-wave, .fx-beam, .app { animation: none; }
    }
  </style>
</head>
<body>
  <div class="fx" aria-hidden="true">
    <div class="fx-wave"></div>
    <div class="fx-beam"></div>
    <div class="fx-noise"></div>
  </div>

  <div class="app">
    <header>
      <div>
        <div class="brand-kicker">services</div>
        <div class="brand-title">Destore</div>
        <div class="brand-sub">Магазин услуг · private catalog</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" type="button">Тема</button>
        <button class="icon-btn" id="toggleAdmin" type="button">Управление</button>
      </div>
    </header>
    <div id="view"></div>
  </div>

  <script>
    const BUY_URL = "https://t.me/desiresceo";
    const STORAGE_KEY = "destore-services-v3";
    const THEME_KEY = "destore-theme";
    const THEMES = ["ember", "noir", "olive"];

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.setHeaderColor("#0c0a09");
        tg.setBackgroundColor("#0c0a09");
      } catch (_) {}
    }

    const seed = {
      categories: [
        {
          id: "c1",
          name: "Личные услуги",
          photo: null,
          products: [
            {
              id: "p1",
              name: "Консультация 30 мин",
              description: "Персональный разбор запроса и план действий.",
              priceUsd: 25,
              priceRub: 2300,
              photo: null,
              status: "buy"
            }
          ]
        },
        {
          id: "c2",
          name: "Подписки",
          photo: null,
          products: []
        }
      ]
    };

    let state = loadState();
    let mode = "catalog";
    let path = { catId: null, productId: null };
    let toast = "";
    let edit = null; // { type: 'cat'|'prod', catId, productId? }

    let theme = localStorage.getItem(THEME_KEY) || "ember";
    if (!THEMES.includes(theme)) theme = "ember";
    document.documentElement.setAttribute("data-theme", theme);

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return migrate(structuredClone(seed));
        const parsed = JSON.parse(raw);
        if (!parsed?.categories) return migrate(structuredClone(seed));
        return migrate(parsed);
      } catch {
        return migrate(structuredClone(seed));
      }
    }

    function migrate(data) {
      data.categories.forEach((c) => {
        (c.products || []).forEach((p) => {
          if (!p.status) {
            if (p.out) p.status = "out";
            else p.status = "buy";
          }
          delete p.out;
        });
      });
      return data;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    function money(p) {
      return `$${Number(p.priceUsd) || 0} · ${Number(p.priceRub) || 0}₽`;
    }

    function statusLabel(status) {
      if (status === "out") return "Нет в наличии";
      if (status === "ask") return "Узнать у продавца";
      return "Купить";
    }

    function thumb(photo, name, large = false) {
      if (photo) return `<img class="thumb${large ? " lg" : ""}" src="${photo}" alt="" />`;
      const letter = (name || "?").trim().charAt(0).toUpperCase();
      return `<div class="thumb-ph${large ? " lg" : ""}">${letter}</div>`;
    }

    async function fileToThumb(file) {
      const bitmap = await createImageBitmap(file);
      const size = 320;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const scale = Math.max(size / bitmap.width, size / bitmap.height);
      const w = bitmap.width * scale;
      const h = bitmap.height * scale;
      ctx.drawImage(bitmap, (size - w) / 2, (size - h) / 2, w, h);
      return canvas.toDataURL("image/jpeg", 0.8);
    }

    function findCat(id) {
      return state.categories.find((c) => c.id === id) || null;
    }

    function findProduct(catId, productId) {
      const cat = findCat(catId);
      return cat?.products.find((p) => p.id === productId) || null;
    }

    function setToast(msg) {
      toast = msg;
      render();
      if (msg) setTimeout(() => { if (toast === msg) { toast = ""; render(); } }, 2200);
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function render() {
      const root = document.getElementById("view");
      document.getElementById("toggleAdmin").textContent = mode === "admin" ? "Витрина" : "Управление";

      if (mode === "admin") {
        root.innerHTML = renderAdmin();
        bindAdmin();
        return;
      }
      if (path.productId && path.catId) {
        root.innerHTML = renderProduct();
        return;
      }
      if (path.catId) {
        root.innerHTML = renderCategory();
        return;
      }
      root.innerHTML = renderCategories();
    }

    function renderCategories() {
      const cats = state.categories;
      if (!cats.length) {
        return `<div class="section-label">Категории</div><div class="empty">Пока нет категорий.<br/>Открой Управление и добавь первую.</div>`;
      }
      return `
        <div class="section-label">Категории услуг</div>
        <div class="list">
          ${cats.map((c) => `
            <button class="card" data-open-cat="${c.id}">
              ${thumb(c.photo, c.name)}
              <div style="min-width:0;flex:1">
                <div class="card-title">${escapeHtml(c.name)}</div>
                <div class="card-meta">${c.products.length} услуг</div>
              </div>
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderCategory() {
      const cat = findCat(path.catId);
      if (!cat) {
        path.catId = null;
        return renderCategories();
      }
      return `
        <button class="ghost back" data-back="home">← Категории</button>
        <div class="detail-head">
          <div class="brand-kicker" style="margin-bottom:4px">категория</div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1">${escapeHtml(cat.name)}</div>
        </div>
        <div class="section-label">Услуги</div>
        ${
          cat.products.length
            ? `<div class="list">${cat.products.map((p) => `
                <button class="card" data-open-product="${p.id}">
                  ${thumb(p.photo, p.name)}
                  <div style="min-width:0;flex:1">
                    <div class="card-title">${escapeHtml(p.name)}</div>
                    <div class="card-meta price">${money(p)}</div>
                    ${p.status === "out" ? `<span class="badge">Нет в наличии</span>` : ""}
                    ${p.status === "ask" ? `<span class="badge ask">Узнать у продавца</span>` : ""}
                  </div>
                </button>
              `).join("")}</div>`
            : `<div class="empty">В этой категории пока нет услуг</div>`
        }
      `;
    }

    function renderProduct() {
      const cat = findCat(path.catId);
      const p = findProduct(path.catId, path.productId);
      if (!cat || !p) {
        path.productId = null;
        return renderCategory();
      }
      const status = p.status || "buy";
      let btn = `<button class="primary" data-buy>Купить</button>`;
      if (status === "ask") btn = `<button class="primary ask" data-buy>Узнать у продавца</button>`;
      if (status === "out") btn = `<button class="primary disabled" type="button">Нет в наличии</button>`;

      return `
        <button class="ghost back" data-back="cat">← Назад</button>
        <div class="detail-head" style="display:flex;gap:14px;align-items:center">
          ${thumb(p.photo, p.name, true)}
          <div>
            <div class="card-title" style="font-size:22px">${escapeHtml(p.name)}</div>
            <div class="card-meta price" style="font-size:16px;margin-top:6px">${money(p)}</div>
          </div>
        </div>
        <p class="hint" style="font-size:14px;color:var(--ink);white-space:pre-wrap;margin-bottom:18px">${escapeHtml(p.description || "Без описания")}</p>
        ${btn}
        ${status !== "out" ? `<div class="hint" style="text-align:center;margin-top:10px">Откроется чат @desiresceo</div>` : ""}
      `;
    }

    function statusOptions(selected) {
      return ["buy", "ask", "out"].map((s) => {
        const labels = { buy: "Купить", ask: "Узнать у продавца", out: "Нет в наличии" };
        return `<option value="${s}" ${selected === s ? "selected" : ""}>${labels[s]}</option>`;
      }).join("");
    }

    function renderAdmin() {
      const editingCat = edit?.type === "cat" ? findCat(edit.catId) : null;
      const editingProd = edit?.type === "prod" ? findProduct(edit.catId, edit.productId) : null;

      return `
        <div class="panel stack">
          <div>
            <div class="brand-kicker">admin</div>
            <h3 style="margin-top:4px;font-family:'Cormorant Garamond',serif;font-size:28px">Управление Destore</h3>
            <p class="hint" style="margin-top:8px">Категории, услуги, цены, фото и статус кнопки покупки.</p>
          </div>
          ${toast ? `<div class="msg">${escapeHtml(toast)}</div>` : ""}

          <div class="admin-block">
            <form id="catForm" class="form-grid">
              <h3>${editingCat ? "Редактировать категорию" : "Новая категория"}</h3>
              <input class="field" name="name" placeholder="Название категории" required value="${escapeHtml(editingCat?.name || "")}" />
              <label class="file-line">Фото категории
                <input type="file" name="photo" accept="image/*" />
              </label>
              <div id="catPreview">${editingCat?.photo ? thumb(editingCat.photo, editingCat.name) : ""}</div>
              <button class="primary" type="submit">${editingCat ? "Сохранить категорию" : "Добавить категорию"}</button>
              ${editingCat ? `<button class="ghost" type="button" id="cancelEdit">Отмена</button>` : ""}
            </form>

            <form id="prodForm" class="form-grid">
              <h3>${editingProd ? "Редактировать услугу" : "Новая услуга"}</h3>
              <select class="select" name="categoryId" required>
                ${state.categories.map((c) => `<option value="${c.id}" ${editingProd && edit.catId === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
              </select>
              <input class="field" name="name" placeholder="Название услуги" required value="${escapeHtml(editingProd?.name || "")}" />
              <textarea class="area" name="description" placeholder="Описание">${escapeHtml(editingProd?.description || "")}</textarea>
              <div class="row-2">
                <input class="field" name="usd" inputmode="decimal" placeholder="Цена $" required value="${editingProd ? editingProd.priceUsd : ""}" />
                <input class="field" name="rub" inputmode="numeric" placeholder="Цена ₽" required value="${editingProd ? editingProd.priceRub : ""}" />
              </div>
              <label class="file-line">Статус кнопки
                <select class="select" name="status">
                  ${statusOptions(editingProd?.status || "buy")}
                </select>
              </label>
              <label class="file-line">Фото услуги
                <input type="file" name="photo" accept="image/*" />
              </label>
              <div id="prodPreview">${editingProd?.photo ? thumb(editingProd.photo, editingProd.name) : ""}</div>
              <button class="primary" type="submit">${editingProd ? "Сохранить услугу" : "Добавить услугу"}</button>
              ${editingProd ? `<button class="ghost" type="button" id="cancelEdit2">Отмена</button>` : ""}
            </form>

            <div>
              <h3>Каталог</h3>
              <div class="spacer"></div>
              <div class="list">
                ${state.categories.map((c) => `
                  <div class="card" style="cursor:default;flex-direction:column;align-items:stretch;gap:10px">
                    <div style="display:flex;gap:12px;align-items:center">
                      ${thumb(c.photo, c.name)}
                      <div style="flex:1;min-width:0">
                        <div class="card-title">${escapeHtml(c.name)}</div>
                        <div class="card-meta">${c.products.length} услуг</div>
                      </div>
                    </div>
                    <div class="edit-row">
                      <button class="soft" data-edit-cat="${c.id}" type="button">Изменить</button>
                      <button class="danger" data-del-cat="${c.id}" type="button">Удалить</button>
                    </div>
                    ${c.products.map((p) => `
                      <div style="display:flex;gap:10px;align-items:center;padding-left:4px">
                        ${thumb(p.photo, p.name)}
                        <div style="flex:1;min-width:0">
                          <div class="card-title" style="font-size:14px">${escapeHtml(p.name)}</div>
                          <div class="card-meta price">${money(p)} · ${statusLabel(p.status || "buy")}</div>
                        </div>
                      </div>
                      <div class="edit-row" style="padding-left:4px">
                        <button class="soft" data-edit-prod="${c.id}:${p.id}" type="button">Изменить</button>
                        <button class="danger" data-del-prod="${c.id}:${p.id}" type="button">Удалить</button>
                      </div>
                    `).join("")}
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="mini-actions">
              <button class="ghost" id="exportBtn" type="button">Экспорт JSON</button>
              <button class="ghost" id="resetBtn" type="button">Сбросить демо</button>
            </div>
          </div>
        </div>
      `;
    }

    function bindAdmin() {
      let catPhoto = edit?.type === "cat" ? (findCat(edit.catId)?.photo || null) : null;
      let prodPhoto = edit?.type === "prod" ? (findProduct(edit.catId, edit.productId)?.photo || null) : null;

      const catForm = document.getElementById("catForm");
      const photoInput = catForm?.querySelector('input[name="photo"]');
      photoInput?.addEventListener("change", async () => {
        const file = photoInput.files?.[0];
        if (!file) return;
        catPhoto = await fileToThumb(file);
        document.getElementById("catPreview").innerHTML = thumb(catPhoto, "C");
      });
      catForm?.addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(catForm);
        const name = String(fd.get("name") || "").trim();
        if (!name) return;
        if (edit?.type === "cat") {
          const cat = findCat(edit.catId);
          if (cat) {
            cat.name = name;
            if (catPhoto !== null) cat.photo = catPhoto;
          }
          edit = null;
          setToast("Категория обновлена");
        } else {
          state.categories.push({ id: uid(), name, photo: catPhoto, products: [] });
          setToast("Категория добавлена");
        }
        saveState();
        catPhoto = null;
      });

      const prodForm = document.getElementById("prodForm");
      const prodPhotoInput = prodForm?.querySelector('input[name="photo"]');
      prodPhotoInput?.addEventListener("change", async () => {
        const file = prodPhotoInput.files?.[0];
        if (!file) return;
        prodPhoto = await fileToThumb(file);
        document.getElementById("prodPreview").innerHTML = thumb(prodPhoto, "P");
      });
      prodForm?.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!state.categories.length) {
          setToast("Сначала создай категорию");
          return;
        }
        const fd = new FormData(prodForm);
        const categoryId = String(fd.get("categoryId"));
        const payload = {
          name: String(fd.get("name") || "").trim(),
          description: String(fd.get("description") || "").trim(),
          priceUsd: Number(String(fd.get("usd")).replace(",", ".")) || 0,
          priceRub: parseInt(String(fd.get("rub")), 10) || 0,
          status: String(fd.get("status") || "buy"),
          photo: prodPhoto
        };
        if (!payload.name) return;

        if (edit?.type === "prod") {
          const oldCat = findCat(edit.catId);
          const prod = findProduct(edit.catId, edit.productId);
          if (prod && oldCat) {
            if (edit.catId !== categoryId) {
              oldCat.products = oldCat.products.filter((p) => p.id !== edit.productId);
              const newCat = findCat(categoryId);
              if (!newCat) return;
              newCat.products.push({ ...prod, ...payload, photo: prodPhoto ?? prod.photo, id: prod.id });
            } else {
              Object.assign(prod, payload);
              if (prodPhoto !== null) prod.photo = prodPhoto;
            }
          }
          edit = null;
          setToast("Услуга обновлена");
        } else {
          const cat = findCat(categoryId);
          if (!cat) return;
          cat.products.push({ id: uid(), ...payload });
          setToast("Услуга добавлена");
        }
        saveState();
        prodPhoto = null;
      });

      document.getElementById("cancelEdit")?.addEventListener("click", () => { edit = null; render(); });
      document.getElementById("cancelEdit2")?.addEventListener("click", () => { edit = null; render(); });

      document.querySelectorAll("[data-edit-cat]").forEach((btn) => {
        btn.addEventListener("click", () => {
          edit = { type: "cat", catId: btn.getAttribute("data-edit-cat") };
          render();
        });
      });
      document.querySelectorAll("[data-edit-prod]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const [catId, productId] = String(btn.getAttribute("data-edit-prod")).split(":");
          edit = { type: "prod", catId, productId };
          render();
        });
      });
      document.querySelectorAll("[data-del-cat]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-cat");
          state.categories = state.categories.filter((c) => c.id !== id);
          if (edit?.catId === id) edit = null;
          saveState();
          setToast("Категория удалена");
        });
      });
      document.querySelectorAll("[data-del-prod]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const [catId, prodId] = String(btn.getAttribute("data-del-prod")).split(":");
          const cat = findCat(catId);
          if (!cat) return;
          cat.products = cat.products.filter((p) => p.id !== prodId);
          if (edit?.productId === prodId) edit = null;
          saveState();
          setToast("Услуга удалена");
        });
      });

      document.getElementById("exportBtn")?.addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "destore-data.json";
        a.click();
      });
      document.getElementById("resetBtn")?.addEventListener("click", () => {
        state = migrate(structuredClone(seed));
        edit = null;
        saveState();
        setToast("Демо-данные восстановлены");
      });
    }

    document.getElementById("toggleAdmin").addEventListener("click", () => {
      mode = mode === "admin" ? "catalog" : "admin";
      path = { catId: null, productId: null };
      edit = null;
      render();
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const i = THEMES.indexOf(theme);
      theme = THEMES[(i + 1) % THEMES.length];
      localStorage.setItem(THEME_KEY, theme);
      document.documentElement.setAttribute("data-theme", theme);
    });

    document.getElementById("view").addEventListener("click", (e) => {
      const t = e.target.closest("[data-open-cat], [data-open-product], [data-back], [data-buy]");
      if (!t) return;
      if (t.hasAttribute("data-open-cat")) {
        path = { catId: t.getAttribute("data-open-cat"), productId: null };
        render();
      } else if (t.hasAttribute("data-open-product")) {
        path.productId = t.getAttribute("data-open-product");
        render();
      } else if (t.getAttribute("data-back") === "home") {
        path = { catId: null, productId: null };
        render();
      } else if (t.getAttribute("data-back") === "cat") {
        path.productId = null;
        render();
      } else if (t.hasAttribute("data-buy")) {
        if (tg?.openTelegramLink) tg.openTelegramLink(BUY_URL);
        else window.open(BUY_URL, "_blank");
      }
    });

    render();
  </script>
</body>
</html>
