<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Destore</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root,[data-theme="ember"]{--bg:#0c0a09;--ink:#f6efe4;--muted:#a89886;--line:rgba(230,177,90,.22);--gold:#e6b15a;--ember:#ff6a45;--card:rgba(255,255,255,.05);--card-solid:#1a1510;--danger:#fb7185;--select-bg:#1a1510;--select-text:#f6efe4}
[data-theme="noir"]{--bg:#07080d;--ink:#eef2f7;--muted:#94a3b8;--line:rgba(148,163,184,.22);--gold:#a5b4fc;--ember:#818cf8;--card:rgba(255,255,255,.05);--card-solid:#111827;--select-bg:#111827;--select-text:#eef2f7}
[data-theme="olive"]{--bg:#0b0d0a;--ink:#f3f0e6;--muted:#9aa38c;--line:rgba(180,190,120,.22);--gold:#c6d36b;--ember:#e0a35b;--card:rgba(255,255,255,.05);--card-solid:#151910;--select-bg:#151910;--select-text:#f3f0e6}
[data-theme="light"]{--bg:#f3eee6;--ink:#1c1410;--muted:#6b5e52;--line:rgba(28,20,16,.12);--gold:#b45309;--ember:#c2410c;--card:rgba(255,255,255,.85);--card-solid:#fff;--select-bg:#fff;--select-text:#1c1410}
[data-theme="white"]{--bg:#fff;--ink:#1c1410;--muted:#6b5e52;--line:rgba(28,20,16,.1);--gold:#b45309;--ember:#ea580c;--card:#f7f3ee;--card-solid:#f7f3ee;--select-bg:#fff;--select-text:#1c1410}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;height:100%;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
body{overflow-x:hidden;min-height:100dvh}
.fx{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg)}
.fx-wave{position:absolute;inset:-50%;background:radial-gradient(ellipse 90% 70% at 0% -10%,color-mix(in oklab,var(--gold) 40%,transparent),transparent 55%),radial-gradient(ellipse 80% 60% at 100% 0%,color-mix(in oklab,var(--ember) 32%,transparent),transparent 50%),radial-gradient(ellipse 70% 50% at 50% 110%,color-mix(in oklab,var(--gold) 22%,transparent),transparent 55%),radial-gradient(ellipse 50% 40% at 90% 70%,color-mix(in oklab,var(--ember) 15%,transparent),transparent 50%);animation:wave 14s ease-in-out infinite alternate}
.fx-beam{position:absolute;width:180%;height:60%;left:-40%;bottom:-15%;background:linear-gradient(20deg,color-mix(in oklab,var(--gold) 20%,transparent),transparent 35%,color-mix(in oklab,var(--ember) 14%,transparent) 65%,transparent);animation:beam 18s ease-in-out infinite alternate;filter:blur(36px)}
.fx-noise{position:absolute;inset:0;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none}
@keyframes wave{0%{transform:translate3d(0,0,0) scale(1) rotate(0deg)}100%{transform:translate3d(-6%,5%,0) scale(1.12) rotate(5deg)}}
@keyframes beam{0%{transform:translateX(-20%) translateY(0) rotate(-6deg);opacity:.5}50%{opacity:1}100%{transform:translateX(20%) translateY(-8%) rotate(-6deg);opacity:.5}}
.app{width:min(100%,440px);margin:0 auto;min-height:100dvh;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;animation:rise .4s ease both}
#view{flex:1;display:flex;flex-direction:column}
.content-wrap{flex:1}
.footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}
.footer-links{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:12px}
.footer-links a{color:var(--muted);text-decoration:none}
.footer-links a:hover{color:var(--gold)}
.footer-copy{text-align:center;margin-top:10px;font-size:11px;color:var(--muted);opacity:.85}
.list{display:grid;gap:10px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(14px);color:inherit;transition:transform .18s ease,border-color .18s ease}
.card:active{transform:scale(.98)}
.thumb,.thumb-ph{width:52px;height:52px;border-radius:16px;flex:none}
.thumb{object-fit:cover;border:1px solid rgba(255,255,255,.08)}
.thumb.lg,.thumb-ph.lg{width:84px;height:84px;border-radius:22px}
.thumb-ph{display:grid;place-items:center;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600;color:var(--gold);background:linear-gradient(145deg,color-mix(in oklab,var(--gold) 22%,var(--card-solid)),var(--card-solid));border:1px solid color-mix(in oklab,var(--gold) 35%,var(--line))}
.thumb-ph.lg{font-size:32px}
.panel{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:16px;backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.field,.area,.select{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--select-bg)!important;color:var(--select-text)!important;padding:12px 14px;font:inherit;outline:none;-webkit-appearance:none;appearance:none}
.select option{background:#1a1510;color:#f6efe4}
[data-theme="olive"] .select option,[data-theme="noir"] .select option{background:#111827;color:#eef2f7}
[data-theme="light"] .select option,[data-theme="white"] .select option{background:#fff;color:#1c1410}
.primary{width:100%;border-radius:999px;padding:15px 18px;font-weight:700;color:#1a1208;background:linear-gradient(135deg,var(--gold),var(--ember));box-shadow:0 8px 24px color-mix(in oklab,var(--ember) 30%,transparent)}
.primary.ask{color:var(--ink);background:transparent;border:1px solid var(--gold);box-shadow:none}
.primary.disabled,.primary:disabled{opacity:.5;pointer-events:none;box-shadow:none}
.content-wrap{flex:1}
.footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}
.footer-links{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:12px}
.footer-links a{color:var(--muted);text-decoration:none}
.footer-links a:hover{color:var(--gold)}
.footer-copy{text-align:center;margin-top:10px;font-size:11px;color:var(--muted);opacity:.85}
select.select{-webkit-appearance:none;appearance:none;background-color:var(--select-bg)!important;color:var(--select-text)!important}
select.select option{background:#1a1510;color:#f6efe4}
</style>
</head>
<body>
<div class="fx" aria-hidden="true"><div class="fx-wave"></div><div class="fx-beam"></div><div class="fx-noise"></div></div>
<div class="app">
  <header>
    <div>
      <div class="brand-kicker">services</div>
      <div class="brand-title">Destore</div>
      <div class="brand-sub">Магазин услуг</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" type="button">Тема</button>
      <button class="icon-btn" id="toggleAdmin" type="button">Управление</button>
    </div>
  </header>
  <div id="view" class="content-wrap"></div>
</div>
<script>
const BUY_URL="https://t.me/desiresceo";
const STORAGE_KEY="destore-services-v3";
const THEME_KEY="destore-theme";
const THEMES=["ember","noir","olive","light","white"];

const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#0c0a09");tg.setBackgroundColor("#0c0a09")}catch(e){}}

const seed={categories:[
{id:"c1",name:"Личные услуги",photo:null,products:[{id:"p1",name:"Консультация 30 мин",description:"Персональный разбор запроса и план действий.",priceUsd:25,priceRub:2300,photo:null,status:"buy"}]},
{id:"c2",name:"Подписки",photo:null,products:[]}
]};

let state=loadState();
let mode="catalog";
let path={catId:null,productId:null};
let toast="";
let edit=null;
let theme=localStorage.getItem(THEME_KEY)||"ember";
if(THEMES.indexOf(theme)<0)theme="ember";
document.documentElement.setAttribute("data-theme",theme);
syncTgTheme();

function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return migrate(JSON.parse(JSON.stringify(seed)));const parsed=JSON.parse(raw);if(!parsed||!parsed.categories)return migrate(JSON.parse(JSON.stringify(seed)));return migrate(parsed)}catch(e){return migrate(JSON.parse(JSON.stringify(seed)))}}
function migrate(data){(data.categories||[]).forEach(function(c){(c.products||[]).forEach(function(p){if(!p.status)p.status=p.out?"out":"buy";delete p.out})});return data}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function uid(){return Math.random().toString(36).slice(2,10)}
function money(p){return "$"+(Number(p.priceUsd)||0)+" · "+(Number(p.priceRub)||0)+"₽"}
function statusLabel(s){if(s==="out")return "Нет в наличии";if(s==="ask")return "Узнать у продавца";return "Купить"}
function thumb(photo,name,large){if(photo)return '<img class="thumb'+(large?" lg":"")+'" src="'+photo+'" alt="" />';var letter=(name||"?").trim().charAt(0).toUpperCase();return '<div class="thumb-ph'+(large?" lg":"")+'">'+letter+"</div>"}
function fileToThumb(file){return createImageBitmap(file).then(function(bitmap){var size=320;var canvas=document.createElement("canvas");canvas.width=size;canvas.height=size;var ctx=canvas.getContext("2d");var scale=Math.max(size/bitmap.width,size/bitmap.height);var w=bitmap.width*scale;var h=bitmap.height*scale;ctx.drawImage(bitmap,(size-w)/2,(size-h)/2,w,h);return canvas.toDataURL("image/jpeg",0.8)})}
function findCat(id){return state.categories.find(function(c){return c.id===id})||null}
function findProduct(catId,productId){var cat=findCat(catId);return cat&&cat.products.find(function(p){return p.id===productId})||null}
function setToast(msg){toast=msg;render();if(msg)setTimeout(function(){if(toast===msg){toast="";render()}},2200)}
function escapeHtml(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function syncTgTheme(){if(!tg)return;try{var dark=theme==="ember"||theme==="noir";tg.setHeaderColor(dark?"#0c0a09":"#f5f0e8");tg.setBackgroundColor(dark?"#0c0a09":"#f5f0e8")}catch(e){}}

function renderFooter(){
  return '<footer class="footer"><div class="footer-links">'+
    '<a href="#" data-footer="agreement">Соглашение</a>'+
    '<a href="#" data-footer="reviews">Отзывы</a>'+
    '<a href="#" data-footer="support">Поддержка</a>'+
    '<a href="https://t.me/desiresceo" target="_blank" rel="noreferrer">Связаться</a>'+
    '</div><div class="footer-copy">© Destore</div></footer>';
}

function renderCategories(){
  var cats=state.categories;
  if(!cats.length){
    return '<div class="content-wrap"><div class="section-label">Категории</div><div class="empty">Пока нет категорий.<br/>Открой Управление и добавь первую.</div></div>'+renderFooter();
  }
  return '<div class="content-wrap"><div class="section-label">Категории услуг</div><div class="list">'+
    cats.map(function(c){
      return '<button class="card" data-open-cat="'+c.id+'">'+thumb(c.photo,c.name)+
        '<div style="min-width:0;flex:1"><div class="card-title">'+escapeHtml(c.name)+'</div>'+
        '<div class="card-meta">'+c.products.length+' услуг</div></div></button>';
    }).join("")+'</div></div>'+renderFooter();
}

function renderCategory(){
  var cat=findCat(path.catId);
  if(!cat){path.catId=null;return renderCategories()}
  var list=cat.products.length
    ? '<div class="list">'+cat.products.map(function(p){
        return '<button class="card" data-open-product="'+p.id+'">'+thumb(p.photo,p.name)+
          '<div style="min-width:0;flex:1"><div class="card-title">'+escapeHtml(p.name)+'</div>'+
          '<div class="card-meta price">'+money(p)+'</div>'+
          (p.status==="out"?'<span class="badge">Нет в наличии</span>':'')+
          (p.status==="ask"?'<span class="badge ask">Узнать у продавца</span>':'')+
          '</div></button>';
      }).join("")+'</div>'
    : '<div class="empty">В этой категории пока нет услуг</div>';
  return '<div class="content-wrap"><button class="ghost back" data-back="home">← Категории</button>'+
    '<div class="detail-head"><div class="brand-kicker" style="margin-bottom:4px">категория</div>'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:28px;line-height:1.1">'+escapeHtml(cat.name)+'</div></div>'+
    '<div class="section-label">Услуги</div>'+list+'</div>'+renderFooter();
}

function renderProduct(){
  var cat=findCat(path.catId);
  var p=findProduct(path.catId,path.productId);
  if(!cat||!p){path.productId=null;return renderCategory()}
  var status=p.status||"buy";
  var btn='<button class="primary" data-buy>Купить</button>';
  if(status==="ask")btn='<button class="primary ask" data-buy>Узнать у продавца</button>';
  if(status==="out")btn='<button class="primary disabled" type="button">Нет в наличии</button>';
  return '<div class="content-wrap"><button class="ghost back" data-back="cat">← Назад</button>'+
    '<div class="detail-head" style="display:flex;gap:14px;align-items:center">'+thumb(p.photo,p.name,true)+
    '<div><div class="card-title" style="font-size:22px">'+escapeHtml(p.name)+'</div>'+
    '<div class="card-meta price" style="font-size:16px;margin-top:6px">'+money(p)+'</div></div></div>'+
    '<p class="hint" style="font-size:14px;color:var(--ink);white-space:pre-wrap;margin-bottom:18px">'+escapeHtml(p.description||"Без описания")+'</p>'+
    btn+(status!=="out"?'<div class="hint" style="text-align:center;margin-top:10px">Откроется чат @desiresceo</div>':'')+
    '</div>'+renderFooter();
}

function renderFooter(){
  return '<footer class="footer"><div class="footer-links">'+
    '<a href="#" data-footer="agreement">Соглашение</a>'+
    '<a href="#" data-footer="reviews">Отзывы</a>'+
    '<a href="#" data-footer="support">Поддержка</a>'+
    '<a href="https://t.me/desiresceo" target="_blank" rel="noreferrer">Связаться</a>'+
    '</div><div class="footer-copy">© Destore</div></footer>';
}

function statusOptions(selected){
  var labels={buy:"Купить",ask:"Узнать у продавца",out:"Нет в наличии"};
  return ["buy","ask","out"].map(function(s){
    return '<option value="'+s+'"'+(selected===s?' selected':'')+'>'+labels[s]+'</option>';
  }).join("");
}

function renderAdmin(){
  var editingCat=edit&&edit.type==="cat"?findCat(edit.catId):null;
  var editingProd=edit&&edit.type==="prod"?findProduct(edit.catId,edit.productId):null;
  return '<div class="content-wrap"><div class="panel stack"><div>'+
    '<div class="brand-kicker">admin</div>'+
    '<h3 style="margin-top:4px;font-family:\'Cormorant Garamond\',serif;font-size:28px">Управление Destore</h3>'+
    '<p class="hint" style="margin-top:8px">Категории, услуги, цены, фото и статус кнопки покупки.</p></div>'+
    (toast?'<div class="msg">'+escapeHtml(toast)+'</div>':'')+
    '<div class="admin-block">'+
    '<form id="catForm" class="form-grid"><h3>'+(editingCat?"Редактировать категорию":"Новая категория")+'</h3>'+
    '<input class="field" name="name" placeholder="Название категории" required value="'+escapeHtml(editingCat&&editingCat.name||"")+'" />'+
    '<label class="file-line">Фото категории<input type="file" name="photo" accept="image/*" /></label>'+
    '<div id="catPreview">'+(editingCat&&editingCat.photo?thumb(editingCat.photo,editingCat.name):"")+'</div>'+
    '<button class="primary" type="submit">'+(editingCat?"Сохранить категорию":"Добавить категорию")+'</button>'+
    (editingCat?'<button class="ghost" type="button" id="cancelEdit">Отмена</button>':'')+
    '</form>'+
    '<form id="prodForm" class="form-grid"><h3>'+(editingProd?"Редактировать услугу":"Новая услуга")+'</h3>'+
    '<select class="select" name="categoryId" required>'+
    state.categories.map(function(c){return '<option value="'+c.id+'"'+(editingProd&&edit.catId===c.id?" selected":"")+'>'+escapeHtml(c.name)+'</option>'}).join("")+
    '</select>'+
    '<input class="field" name="name" placeholder="Название услуги" required value="'+escapeHtml(editingProd&&editingProd.name||"")+'" />'+
    '<textarea class="area" name="description" placeholder="Описание">'+escapeHtml(editingProd&&editingProd.description||"")+'</textarea>'+
    '<div class="row-2"><input class="field" name="usd" inputmode="decimal" placeholder="Цена $" required value="'+(editingProd?editingProd.priceUsd:"")+'" />'+
    '<input class="field" name="rub" inputmode="numeric" placeholder="Цена ₽" required value="'+(editingProd?editingProd.priceRub:"")+'" /></div>'+
    '<label class="file-line">Статус кнопки<select class="select" name="status">'+statusOptions(editingProd&&editingProd.status||"buy")+'</select></label>'+
    '<label class="file-line">Фото услуги<input type="file" name="photo" accept="image/*" /></label>'+
    '<div id="prodPreview">'+(editingProd&&editingProd.photo?thumb(editingProd.photo,editingProd.name):"")+'</div>'+
    '<button class="primary" type="submit">'+(editingProd?"Сохранить услугу":"Добавить услугу")+'</button>'+
    (editingProd?'<button class="ghost" type="button" id="cancelEdit2">Отмена</button>':'')+
    '</form>'+
    '<div><h3>Каталог</h3><div class="spacer"></div><div class="list">'+
    state.categories.map(function(c){
      return '<div class="card" style="cursor:default;flex-direction:column;align-items:stretch;gap:10px">'+
        '<div style="display:flex;gap:12px;align-items:center">'+thumb(c.photo,c.name)+
        '<div style="flex:1;min-width:0"><div class="card-title">'+escapeHtml(c.name)+'</div>'+
        '<div class="card-meta">'+c.products.length+' услуг</div></div></div>'+
        '<div class="edit-row"><button class="soft" data-edit-cat="'+c.id+'" type="button">Изменить</button>'+
        '<button class="danger" data-del-cat="'+c.id+'" type="button">Удалить</button></div>'+
        c.products.map(function(p){
          return '<div style="display:flex;gap:10px;align-items:center;padding-left:4px">'+thumb(p.photo,p.name)+
            '<div style="flex:1;min-width:0"><div class="card-title" style="font-size:14px">'+escapeHtml(p.name)+'</div>'+
            '<div class="card-meta price">'+money(p)+' · '+statusLabel(p.status||"buy")+'</div></div></div>'+
            '<div class="edit-row" style="padding-left:4px"><button class="soft" data-edit-prod="'+c.id+':'+p.id+'" type="button">Изменить</button>'+
            '<button class="danger" data-del-prod="'+c.id+':'+p.id+'" type="button">Удалить</button></div>';
        }).join("")+'</div>';
    }).join("")+'</div></div>'+
    '<div class="mini-actions"><button class="ghost" id="exportBtn" type="button">Экспорт JSON</button>'+
    '<button class="ghost" id="resetBtn" type="button">Сбросить демо</button></div></div></div>'+renderFooter();
}

function renderFooter(){
  return '<footer class="footer"><div class="footer-links">'+
    '<a href="#" data-footer="agreement">Соглашение</a>'+
    '<a href="#" data-footer="reviews">Отзывы</a>'+
    '<a href="#" data-footer="support">Поддержка</a>'+
    '<a href="https://t.me/desiresceo" target="_blank" rel="noreferrer">Связаться</a>'+
    '</div><div class="footer-copy">© Destore</div></footer>';
}

function renderCategories(){
  var cats=state.categories;
  if(!cats.length){
    return '<div class="content-wrap"><div class="section-label">Категории</div><div class="empty">Пока нет категорий.<br/>Открой Управление и добавь первую.</div></div>'+renderFooter();
  }
  return '<div class="content-wrap"><div class="section-label">Категории услуг</div><div class="list">'+
    cats.map(function(c){
      return '<button class="card" data-open-cat="'+c.id+'">'+thumb(c.photo,c.name)+
        '<div style="min-width:0;flex:1"><div class="card-title">'+escapeHtml(c.name)+'</div>'+
        '<div class="card-meta">'+c.products.length+' услуг</div></div></button>';
    }).join("")+'</div></div>'+renderFooter();
}

function renderCategory(){
  var cat=findCat(path.catId);
  if(!cat){path.catId=null;return renderCategories()}
  var list=cat.products.length
    ? '<div class="list">'+cat.products.map(function(p){
        return '<button class="card" data-open-product="'+p.id+'">'+thumb(p.photo,p.name)+
          '<div style="min-width:0;flex:1"><div class="card-title">'+escapeHtml(p.name)+'</div>'+
          '<div class="card-meta price">'+money(p)+'</div>'+
          (p.status==="out"?'<span class="badge">Нет в наличии</span>':'')+
          (p.status==="ask"?'<span class="badge ask">Узнать у продавца</span>':'')+
          '</div></button>';
      }).join("")+'</div>'
    : '<div class="empty">В этой категории пока нет услуг</div>';
  return '<div class="content-wrap"><button class="ghost back" data-back="home">← Категории</button>'+
    '<div class="detail-head"><div class="brand-kicker" style="margin-bottom:4px">категория</div>'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:28px;line-height:1.1">'+escapeHtml(cat.name)+'</div></div>'+
    '<div class="section-label">Услуги</div>'+list+'</div>'+renderFooter();
}

function renderProduct(){
  var cat=findCat(path.catId);
  var p=findProduct(path.catId,path.productId);
  if(!cat||!p){path.productId=null;return renderCategory()}
  var status=p.status||"buy";
  var btn='<button class="primary" data-buy>Купить</button>';
  if(status==="ask")btn='<button class="primary ask" data-buy>Узнать у продавца</button>';
  if(status==="out")btn='<button class="primary disabled" type="button">Нет в наличии</button>';
  return '<div class="content-wrap"><button class="ghost back" data-back="cat">← Назад</button>'+
    '<div class="detail-head" style="display:flex;gap:14px;align-items:center">'+thumb(p.photo,p.name,true)+
    '<div><div class="card-title" style="font-size:22px">'+escapeHtml(p.name)+'</div>'+
    '<div class="card-meta price" style="font-size:16px;margin-top:6px">'+money(p)+'</div></div></div>'+
    '<p class="hint" style="font-size:14px;color:var(--ink);white-space:pre-wrap;margin-bottom:18px">'+escapeHtml(p.description||"Без описания")+'</p>'+
    btn+(status!=="out"?'<div class="hint" style="text-align:center;margin-top:10px">Откроется чат @desiresceo</div>':'')+
    '</div>'+renderFooter();
}

function renderFooter(){
  return '<footer class="footer"><div class="footer-links">'+
    '<a href="#" data-footer="agreement">Соглашение</a>'+
    '<a href="#" data-footer="reviews">Отзывы</a>'+
    '<a href="#" data-footer="support">Поддержка</a>'+
    '<a href="https://t.me/desiresceo" target="_blank" rel="noreferrer">Связаться</a>'+
    '</div><div class="footer-copy">© Destore</div></footer>';
}

function render(){
  var root=document.getElementById("view");
  document.getElementById("toggleAdmin").textContent=mode==="admin"?"Витрина":"Управление";
  if(mode==="admin"){root.innerHTML=renderAdmin();bindAdmin();return}
  if(path.productId&&path.catId){root.innerHTML=renderProduct();return}
  if(path.catId){root.innerHTML=renderCategory();return}
  root.innerHTML=renderCategories();
}

document.getElementById("toggleAdmin").addEventListener("click",function(){
  mode=mode==="admin"?"catalog":"admin";
  path={catId:null,productId:null};
  edit=null;
  render();
});

document.getElementById("themeBtn").addEventListener("click",function(){
  var i=THEMES.indexOf(theme);
  theme=THEMES[(i+1)%THEMES.length];
  localStorage.setItem(THEME_KEY,theme);
  document.documentElement.setAttribute("data-theme",theme);
  if(tg){try{var dark=theme==="ember"||theme==="noir";tg.setHeaderColor(dark?"#0c0a09":"#f5f0e8");tg.setBackgroundColor(dark?"#0c0a09":"#f5f0e8")}catch(e){}}
});

document.getElementById("view").addEventListener("click",function(e){
  var t=e.target.closest("[data-open-cat],[data-open-product],[data-back],[data-buy],[data-footer]");
  if(!t)return;
  if(t.hasAttribute("data-open-cat")){path={catId:t.getAttribute("data-open-cat"),productId:null};render()}
  else if(t.hasAttribute("data-open-product")){path.productId=t.getAttribute("data-open-product");render()}
  else if(t.getAttribute("data-back")==="home"){path={catId:null,productId:null};render()}
  else if(t.getAttribute("data-back")==="cat"){path.productId=null;render()}
  else if(t.hasAttribute("data-buy")){if(tg&&tg.openTelegramLink)tg.openTelegramLink(BUY_URL);else window.open(BUY_URL,"_blank")}
  else if(t.hasAttribute("data-footer")){
    var key=t.getAttribute("data-footer");
    if(key==="agreement")setToast("Пользовательское соглашение — скоро");
    if(key==="reviews")setToast("Отзывы — скоро");
    if(key==="support"){if(tg&&tg.openTelegramLink)tg.openTelegramLink(BUY_URL);else window.open(BUY_URL,"_blank")}
  }
});

render();
  </script>
</body>
</html>
