<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #07070f;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Мощный анимированный фон */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(236, 72, 153, 0.15) 0%, transparent 60%),
        #07070f;
      animation: bgPulse 12s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { filter: hue-rotate(0deg) brightness(1); }
      100% { filter: hue-rotate(25deg) brightness(1.1); }
    }

    .bg-blur {
      position: fixed;
      inset: 0;
      z-index: -1;
      backdrop-filter: blur(60px);
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
      padding: 20px 16px 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc, #22d3ee, #f472b6);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: logoShine 6s ease infinite;
    }

    @keyframes logoShine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .admin-badge {
      background: linear-gradient(135deg, rgba(192, 132, 252, 0.25), rgba(34, 211, 238, 0.15));
      border: 1px solid rgba(192, 132, 252, 0.5);
      color: #e9d5ff;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      display: none;
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.3);
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card:active {
      transform: scale(0.975);
    }

    .card:hover {
      border-color: rgba(192, 132, 252, 0.4);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.15);
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-price {
      font-size: 15px;
      font-weight: 600;
      color: #2dd4bf;
    }

    .card-status {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #fb7185;
      background: rgba(251, 113, 133, 0.15);
      padding: 3px 10px;
      border-radius: 20px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 50%, #22d3ee 100%);
      background-size: 200% 200%;
      color: white;
      box-shadow: 0 6px 25px rgba(139, 92, 246, 0.5);
      animation: btnGlow 4s ease infinite;
    }

    @keyframes btnGlow {
      0%, 100% { background-position: 0% 50%; box-shadow: 0 6px 25px rgba(139, 92, 246, 0.5); }
      50% { background-position: 100% 50%; box-shadow: 0 6px 30px rgba(217, 70, 239, 0.55); }
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      transform: skewX(-20deg);
      animation: shine 3.5s infinite;
    }

    @keyframes shine {
      0% { left: -60%; }
      20% { left: 120%; }
      100% { left: 120%; }
    }

    .btn-back {
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
      margin-bottom: 18px;
      font-weight: 500;
      font-size: 15px;
    }

    .product-detail {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .product-detail.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .product-name {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .product-price {
      font-size: 20px;
      font-weight: 700;
      color: #2dd4bf;
      margin-bottom: 16px;
    }

    .product-desc {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 50px 20px;
      font-size: 15px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-blur"></div>

  <div class="container">
    <header>
      <div class="logo">Каталог</div>
      <div class="admin-badge" id="adminBadge">Админ</div>
    </header>

    <div id="categoriesView">
      <div class="section-title">Категории</div>
      <div id="categoriesList"></div>
      <div class="empty hidden" id="emptyCategories">Категорий пока нет</div>
    </div>

    <div id="productsView" class="hidden">
      <button class="btn btn-back" onclick="showCategories()">← Назад к категориям</button>
      <div class="section-title" id="categoryTitle">Товары</div>
      <div id="productsList"></div>
    </div>

    <div id="productDetail" class="product-detail">
      <button class="btn btn-back" onclick="showProducts()">← Назад</button>
      <div class="product-name" id="detailName"></div>
      <div class="product-price" id="detailPrice"></div>
      <div class="product-desc" id="detailDesc"></div>
      <div id="detailStatus"></div>
      <br><br>
      <button class="btn btn-primary" onclick="buyProduct()">🛒 Купить</button>
    </div>
  </div>

  <script>
    const ADMINS = [7535464331, 8404412552];
    let data = { categories: {} };
    let currentCategoryId = null;

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#07070f');
    tg.setBackgroundColor('#07070f');

    const user = tg.initDataUnsafe?.user;
    if (user && ADMINS.includes(user.id)) {
      document.getElementById('adminBadge').style.display = 'inline-block';
    }

    function loadData() {
      data = {
        categories: {
          "1": {
            name: "Иммортали",
            products: {
              "1": {
                name: "I always wanted to die",
                description: "Голова Phantom Lancer\nImmortal\nМожно обменять и продать",
                price_usd: 28,
                price_rub: 2500,
                out_of_stock: false
              },
              "2": {
                name: "Пример Immortal 2",
                description: "Красивый предмет для героя",
                price_usd: 45,
                price_rub: 4100,
                out_of_stock: true
              }
            }
          },
          "2": {
            name: "Сеты",
            products: {
              "1": {
                name: "Тестовый сет",
                description: "Полный сет для героя",
                price_usd: 12,
                price_rub: 1100,
                out_of_stock: false
              }
            }
          }
        }
      };
      renderCategories();
    }

    function renderCategories() {
      const list = document.getElementById('categoriesList');
      const empty = document.getElementById('emptyCategories');
      list.innerHTML = '';
      const cats = Object.entries(data.categories);

      if (cats.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      cats.forEach(([id, cat]) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<div class="card-title">${cat.name}</div>`;
        div.onclick = () => openCategory(id);
        list.appendChild(div);
      });
    }

    function openCategory(id) {
      currentCategoryId = id;
      const cat = data.categories[id];
      document.getElementById('categoryTitle').textContent = cat.name;
      document.getElementById('categoriesView').classList.add('hidden');
      document.getElementById('productsView').classList.remove('hidden');
      document.getElementById('productDetail').classList.remove('active');

      const list = document.getElementById('productsList');
      list.innerHTML = '';
      const products = Object.entries(cat.products || {});

      if (products.length === 0) {
        list.innerHTML = '<div class="empty">В этой категории пока нет товаров</div>';
        return;
      }

      products.forEach(([pid, prod]) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="card-title">${prod.name}</div>
          <div class="card-price">$${prod.price_usd} / ${prod.price_rub}₽</div>
          ${prod.out_of_stock ? '<div class="card-status">Нет в наличии</div>' : ''}
        `;
        div.onclick = () => openProduct(pid);
        list.appendChild(div);
      });
    }

    function openProduct(pid) {
      const prod = data.categories[currentCategoryId].products[pid];
      document.getElementById('detailName').textContent = prod.name;
      document.getElementById('detailPrice').textContent = `$${prod.price_usd} / ${prod.price_rub}₽`;
      document.getElementById('detailDesc').textContent = prod.description || '';
      document.getElementById('detailStatus').innerHTML = prod.out_of_stock ? '<div class="card-status">Нет в наличии</div>' : '';

      document.getElementById('productsView').classList.add('hidden');
      document.getElementById('productDetail').classList.add('active');
    }

    function showCategories() {
      document.getElementById('categoriesView').classList.remove('hidden');
      document.getElementById('productsView').classList.add('hidden');
      document.getElementById('productDetail').classList.remove('active');
    }

    function showProducts() {
      document.getElementById('productsView').classList.remove('hidden');
      document.getElementById('productDetail').classList.remove('active');
    }

    function buyProduct() {
      tg.openTelegramLink('https://t.me/desiresceo');
    }

    loadData();
  </script>
</body>
</html>
