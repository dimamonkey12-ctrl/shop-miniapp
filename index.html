<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f13;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Анимированный фон */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(125deg, #0f0f13, #1a1a2e, #16213e, #0f3460, #1a1a2e);
      background-size: 400% 400%;
      animation: gradient 18s ease infinite;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-top: 8px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .admin-badge {
      background: rgba(167, 139, 250, 0.2);
      border: 1px solid rgba(167, 139, 250, 0.4);
      color: #c4b5fd;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      display: none;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #e2e8f0;
    }

    /* Карточки категорий */
    .categories, .products {
      display: grid;
      gap: 12px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(167,139,250,0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-price {
      font-size: 14px;
      color: #34d399;
      font-weight: 500;
    }

    .card-status {
      font-size: 12px;
      color: #f87171;
      margin-top: 6px;
    }

    /* Кнопки */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.96);
      box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.25), transparent);
      transform: rotate(30deg);
      animation: shine 4s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) rotate(30deg); }
      20% { transform: translateX(100%) rotate(30deg); }
      100% { transform: translateX(100%) rotate(30deg); }
    }

    .btn-back {
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      margin-bottom: 16px;
      width: 100%;
    }

    .product-detail {
      display: none;
    }

    .product-detail.active {
      display: block;
    }

    .product-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 18px;
      color: #34d399;
      margin-bottom: 12px;
    }

    .product-desc {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 40px 20px;
      font-size: 15px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="container">
    <header>
      <div class="logo">Каталог</div>
      <div class="admin-badge" id="adminBadge">Админ</div>
    </header>

    <!-- Список категорий -->
    <div id="categoriesView">
      <div class="section-title">Категории</div>
      <div class="categories" id="categoriesList"></div>
      <div class="empty hidden" id="emptyCategories">Категорий пока нет</div>
    </div>

    <!-- Список товаров -->
    <div id="productsView" class="hidden">
      <button class="btn btn-back" onclick="showCategories()">← Назад</button>
      <div class="section-title" id="categoryTitle">Товары</div>
      <div class="products" id="productsList"></div>
    </div>

    <!-- Карточка товара -->
    <div id="productDetail" class="product-detail">
      <button class="btn btn-back" onclick="showProducts()">← Назад</button>
      <div class="product-name" id="detailName"></div>
      <div class="product-price" id="detailPrice"></div>
      <div class="product-desc" id="detailDesc"></div>
      <div id="detailStatus" class="card-status"></div>
      <br>
      <button class="btn btn-primary" style="width:100%" onclick="buyProduct()">
        🛒 Купить
      </button>
    </div>
  </div>

  <script>
    const ADMINS = [7535464331, 8404412552];
    let data = { categories: {} };
    let currentCategoryId = null;
    let currentProduct = null;

    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#0f0f13');
    tg.setBackgroundColor('#0f0f13');

    // Проверка админа
    const user = tg.initDataUnsafe?.user;
    if (user && ADMINS.includes(user.id)) {
      document.getElementById('adminBadge').style.display = 'inline-block';
    }

    // Загрузка данных (пока тестовые, потом подключим JSON)
    function loadData() {
      // Временные тестовые данные
      data = {
        categories: {
          "1": {
            name: "Иммортали",
            products: {
              "1": {
                name: "I always wanted to die",
                description: "Голова Phantom Lancer\nImmortal",
                price_usd: 28,
                price_rub: 2500,
                out_of_stock: false
              },
              "2": {
                name: "Пример товара 2",
                description: "Описание второго товара",
                price_usd: 15,
                price_rub: 1400,
                out_of_stock: true
              }
            }
          },
          "2": {
            name: "Сеты",
            products: {}
          }
        }
      };
      renderCategories();
    }

    function renderCategories() {
      const list = document.getElementById('categoriesList');
      const empty = document.getElementById('emptyCategories');
      list.innerHTML = '';

      const cats = Object.entries(data.categories);
      if (cats.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      cats.forEach(([id, cat]) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<div class="card-title">${cat.name}</div>`;
        div.onclick = () => openCategory(id);
        list.appendChild(div);
      });
    }

    function openCategory(id) {
      currentCategoryId = id;
      const cat = data.categories[id];
      document.getElementById('categoryTitle').textContent = cat.name;
      document.getElementById('categoriesView').classList.add('hidden');
      document.getElementById('productsView').classList.remove('hidden');
      document.getElementById('productDetail').classList.remove('active');

      const list = document.getElementById('productsList');
      list.innerHTML = '';

      const products = Object.entries(cat.products || {});
      if (products.length === 0) {
        list.innerHTML = '<div class="empty">В этой категории пока нет товаров</div>';
        return;
      }

      products.forEach(([pid, prod]) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="card-title">${prod.name}</div>
          <div class="card-price">$${prod.price_usd} / ${prod.price_rub}₽</div>
          ${prod.out_of_stock ? '<div class="card-status">❌ Нет в наличии</div>' : ''}
        `;
        div.onclick = () => openProduct(pid);
        list.appendChild(div);
      });
    }

    function openProduct(pid) {
      const prod = data.categories[currentCategoryId].products[pid];
      currentProduct = prod;

      document.getElementById('detailName').textContent = prod.name;
      document.getElementById('detailPrice').textContent = `$${prod.price_usd} / ${prod.price_rub}₽`;
      document.getElementById('detailDesc').textContent = prod.description || '';
      document.getElementById('detailStatus').textContent = prod.out_of_stock ? '❌ Нет в наличии' : '';

      document.getElementById('productsView').classList.add('hidden');
      document.getElementById('productDetail').classList.add('active');
    }

    function showCategories() {
      document.getElementById('categoriesView').classList.remove('hidden');
      document.getElementById('productsView').classList.add('hidden');
      document.getElementById('productDetail').classList.remove('active');
    }

    function showProducts() {
      document.getElementById('productsView').classList.remove('hidden');
      document.getElementById('productDetail').classList.remove('active');
    }

    function buyProduct() {
      tg.openTelegramLink('https://t.me/desiresceo');
    }

    // Запуск
    loadData();
  </script>
</body>
</html>
